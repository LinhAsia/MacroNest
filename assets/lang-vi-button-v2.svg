<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 40" width="190" height="40">
  <defs>
    <linearGradient id="btn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(22% 0.02 255)"/>
      <stop offset="100%" stop-color="oklch(30% 0.03 262)"/>
    </linearGradient>
  </defs>

  <style>
    .btn-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      fill: oklch(98% 0.01 255);
    }
  </style>

  <!-- Button Background -->
  <rect width="190" height="40" rx="12" fill="url(#btn-bg)" stroke="oklch(42% 0.03 255)" stroke-width="1.5"/>

  <!-- Globe / Translation Icon -->
  <g stroke="oklch(81% 0.17 190)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="20" r="9" />
    <path d="M 17 20 L 35 20" />
    <path d="M 26 11 A 9 9 0 0 1 26 29 A 9 9 0 0 1 26 11 Z" stroke-width="1.5" />
    <path d="M 26 11 L 26 29" />
  </g>

  <!-- "TIẾNG VIỆT" Text -->
  <text x="46" y="25" class="btn-text">TIẾNG VIỆT</text>
</svg>
